name: ishaqiyin_admin
description: "لوحة إدارة تطبيق الإسحاقيين — إدارة الأقسام والدروس والكتب والمشرفين"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (admin = قراءة + كتابة، تسجيل دخول آمن، إرسال إشعارات)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.5
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1

  # تسجيل الدخول بـ Google (نمط لوحة نبراس)
  google_sign_in: ^6.2.1

  # اختيار ملفات الصوت / PDF من الجهاز
  file_picker: ^8.1.2

  # وسائط الدردشة: بصمة مستقرّة لاسم الملفّ المحلّي + فتح الملفّات المنزَّلة
  # بتطبيق النظام (نمط واتساب: تنزيل أولاً ثم فتح محلّي).
  crypto: ^3.0.6
  open_filex: ^4.7.0

  # التسجيل الصوتي المباشر داخل اللوحة (طريق ثانوي لإضافة صوتية)
  record: ^6.1.1
  # معاينة صوت مساهمات المستمعين قبل الموافقة (شاشة طلبات النشر)
  just_audio: ^0.9.42
  cached_network_image: ^3.4.1
  video_player: ^2.9.5
  url_launcher: ^6.3.1
  intl: ^0.20.2
  path_provider: ^2.1.5

  # جلسة المشرف محلياً
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
